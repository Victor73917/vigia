# Recolecta los datos de VIGÍA y publica la página en GitHub Pages, sin que nadie tenga que subir nada.
# Cada hora: emergencias del INDECI, METAR, imagen térmica, IMERG y GDACS.
# El SENAMHI y el ENFEN no responden a los servidores de GitHub: se piden a través del Worker de Cloudflare
# nube/puente-peru.js (VIGIA_PROXY), que solo atiende las direcciones que usa VIGÍA. Si algún día se le pone el
# secreto CLAVE, el mismo valor va en el secreto VIGIA_PROXY_CLAVE de GitHub. Si la rama datos-peru trae datos
# más nuevos (la antigua tarea de la PC), se usan esos.
# Cada 6 horas: todas las fuentes (pronósticos, caudales de GloFAS, distritos, océano).
# También se puede correr a mano desde la pestaña Actions («Run workflow»), eligiendo las fuentes.
# Producción (/vigia/) se arma siempre desde main. La rama desarrollo se arma en /vigia/pruebas/, con los mismos datos
# y una marca de «entorno de pruebas». En los cambios de código (push o a mano) corre la prueba automática de navegación
# sobre el sitio de pruebas y, si falla, no se publica nada. GitHub Pages solo publica desde main: un cambio en desarrollo
# corre las pruebas y, si pasan, pide a main que vuelva a publicar (producción sigue con el código de main).
name: Recolectar y publicar VIGÍA

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "41 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes separadas por espacios (vacío = todas). Ej.: avisos emergencias"
        required: false
        default: ""
  push:
    branches: [main, desarrollo]

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar librerías del recolector
        run: pip install eccodes numpy pypdf

      # los datos de la corrida anterior: así una corrida parcial conserva las demás fuentes
      - name: Recuperar datos de la corrida anterior
        uses: actions/cache/restore@v6
        with:
          path: |
            datos/instantanea.js
            datos/rios.js
            datos/salidas.json
            datos/indeci_cache.json
            datos/historias.json
            datos/lluvia-*.png
            datos/termica.jpg
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      # caché aparte: sumar un archivo a la de arriba cambia su versión y la corrida no encontraría los datos anteriores
      - name: Recuperar las cuencas de todo el Perú
        uses: actions/cache/restore@v6
        with:
          path: datos/unidades.json
          key: unidades-${{ github.run_id }}
          restore-keys: unidades-

      - name: Traer los datos que sube la PC desde el Perú
        run: |
          git fetch --depth=1 origin datos-peru && git show FETCH_HEAD:peru.json > datos/peru.json || echo "Todavía no hay datos de la PC"

      - name: Recolectar
        env:
          VIGIA_ESPERA: "45"
          VIGIA_PROXY: https://vigia-puente.claudecode13213.workers.dev
          VIGIA_PROXY_CLAVE: ${{ secrets.VIGIA_PROXY_CLAVE }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Cambio en el código o datos nuevos de la PC: se publica sin bajar fuentes"
            python -X utf8 recolectar.py nada
          elif [ "${{ github.event.schedule }}" = "17 * * * *" ]; then
            python -X utf8 recolectar.py emergencias aerodromos termica imerg mundo avisos quebradas enfen rios_pe || echo "El recolector terminó con errores; se publica lo que se pudo"
          else
            python -X utf8 recolectar.py ${{ github.event.inputs.fuentes }} || echo "El recolector terminó con errores; se publica lo que se pudo"
          fi

      - name: Guardar datos para la próxima corrida
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            datos/instantanea.js
            datos/rios.js
            datos/salidas.json
            datos/indeci_cache.json
            datos/historias.json
            datos/lluvia-*.png
            datos/termica.jpg
          key: datos-${{ github.run_id }}

      - name: Guardar las cuencas de todo el Perú
        if: always() && hashFiles('datos/unidades.json') != ''
        uses: actions/cache/save@v6
        with:
          path: datos/unidades.json
          key: unidades-${{ github.run_id }}

      - name: Armar la página
        env:
          VIGIA_SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python construir.py --paquete

      - name: Armar el sitio de pruebas (rama desarrollo)
        env:
          VIGIA_SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pruebas
          VIGIA_PRUEBAS: "1"
        run: |
          if git fetch --depth=1 origin desarrollo; then
            git worktree add --detach ../dev FETCH_HEAD
            cp -r datos/. ../dev/datos/
            (cd ../dev && python construir.py --paquete)
            mkdir -p publicar/pruebas
            cp -r ../dev/publicar/. publicar/pruebas/
            rm -f publicar/pruebas/_headers publicar/pruebas/_redirects
          else
            echo "No hay rama desarrollo: solo se publica producción"
          fi

      - name: Probar la navegación en el sitio de pruebas
        if: github.event_name != 'schedule'
        run: |
          if [ ! -f ../dev/pruebas/navegacion.py ]; then echo "La rama desarrollo no trae pruebas"; exit 0; fi
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --directory publicar --bind 127.0.0.1 &
          sleep 2
          python ../dev/pruebas/navegacion.py http://127.0.0.1:8765/pruebas/

      - name: Pedir a main que publique el sitio de pruebas
        if: github.ref_name == 'desarrollo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --repo "${{ github.repository }}" --ref main -f fuentes=nada

      - if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: publicar

  publicar:
    needs: recolectar
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
